<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">ZoMoZAAA Gaming Favicon</title>

  <defs>
    <linearGradient id="z" x1="80" y1="50" x2="430" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".42" stop-color="#2563EB"/>
      <stop offset=".72" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="edge" x1="100" y1="60" x2="410" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Neon Z -->
  <path
    d="M86 82H411L292 201H425L181 445V329H70L211 187H86Z"
    fill="none"
    stroke="#22D3EE"
    stroke-width="22"
    opacity=".28"
    filter="url(#glow)"
  />

  <path
    d="M86 82H411L292 201H425L181 445V329H70L211 187H86Z"
    fill="url(#z)"
    stroke="url(#edge)"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Dark inner bevel -->
  <path
    d="M101 105H359L250 213H374L198 390V310H109L244 177H101Z"
    fill="#050816"
    opacity=".88"
  />

  <!-- Controller -->
  <path
    d="M160 260
       C169 228 196 210 226 217
       L276 229
       C306 236 330 258 337 286
       C342 307 335 330 318 341
       C301 351 286 337 275 320
       L264 303
       H214
       L203 320
       C192 337 177 351 160 341
       C143 330 136 307 141 286
       C145 276 151 267 160 260Z"
    fill="#030712"
    stroke="#22D3EE"
    stroke-width="6"
    filter="url(#smallGlow)"
  />

  <!-- D-pad -->
  <path
    d="M177 270H191V284H205V298H191V312H177V298H163V284H177Z"
    fill="#22D3EE"
  />

  <!-- Controller buttons -->
  <circle cx="270" cy="269" r="12" fill="#A855F7"/>
  <circle cx="294" cy="293" r="12" fill="#D946EF"/>
  <circle cx="246" cy="293" r="12" fill="#3B82F6"/>
  <circle cx="270" cy="317" r="12" fill="#7C3AED"/>

  <!-- Highlights -->
  <path
    d="M102 101H352"
    stroke="#E0F2FE"
    stroke-width="5"
    stroke-linecap="round"
    opacity=".8"
  />
  <path
    d="M91 329L174 414"
    stroke="#F0ABFC"
    stroke-width="5"
    stroke-linecap="round"
    opacity=".55"
  />
</svg>